aid: syzygy-plasmonics
name: Syzygy Plasmonics
description: >-
  Syzygy Plasmonics is a Houston, Texas deep-decarbonization company commercializing
  photocatalytic chemical manufacturing. Its Rigel reactor cell uses photonic energy from
  renewable electricity in place of combustion heat to drive reforming reactions, and its
  NovaSAF / GHG e-Reforming pathway converts waste biogas into low-carbon sustainable
  aviation fuel, independently assessed as eligible for both ISCC EU RFNBO and Advanced
  BioSAF certification. Adjacent targets include hydrogen from ammonia e-cracking, syngas,
  methanol, butadiene and other commodity chemicals, sold as reactor hardware plus a
  licensing and front-end engineering support package. Syzygy is a hardware and
  process-licensing business, not a software vendor: as of 2026-08-29 it publishes no
  developer portal, API reference, SDK, or machine-readable specification of any kind.
